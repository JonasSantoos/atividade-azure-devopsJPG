name: Node.js CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Localizar package.json
        id: find-package
        shell: bash
        run: |
          echo "Procurando package.json..."

          PACKAGE_JSON=$(find . -name "package.json" -not -path "./node_modules/*" | head -n 1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERRO: Nenhum package.json foi encontrado no projeto."
            echo "Estrutura do projeto:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          echo "package.json encontrado em:"
          echo "$PACKAGE_JSON"

          echo "Pasta do projeto:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Instalar dependências
        working-directory: ${{ steps.find-package.outputs.project_dir }}
        run: npm install

      - name: Executar build
        working-directory: ${{ steps.find-package.outputs.project_dir }}
        run: npm run build
